version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rekaz-postgres
    environment:
      POSTGRES_USER: rekaz_admin
      POSTGRES_PASSWORD: rekaz_password
      POSTGRES_DB: rekaz_petroleum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rekaz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekaz_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rekaz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rekaz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekaz-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rekaz_admin:rekaz_password@postgres:5432/rekaz_petroleum?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rekaz-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  rekaz-network:
    driver: bridge